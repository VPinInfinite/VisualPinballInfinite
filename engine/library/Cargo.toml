[package]
name = "library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The table library's engine side: VPS's database, what a dropped file holds, and matching a table to VPS"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# a table's info and script, without its pictures
vpin = "0.38"
# a download's archive, listed from its central directory
zip = { version = "8", default-features = false, features = ["deflate"] }
# a ROM file's CRC, for checking a set that isn't a zip (zips keep their files' own)
crc32fast = "1.5"
# a download in a 7-Zip archive: reading alone, its methods in Rust (bzip2's port included)
sevenz-rust2 = { version = "0.24", default-features = false, features = ["bzip2", "deflate", "ppmd"] }
# a ROM machine's high scores from its memory (`.nv`), through the Pinball Memory Maps it carries
# (MIT; the maps ODbL, credited in CREDITS.md)
pinmame-nvram = "=0.4.18"
# VPX's saved values (`VPReg.stg`, a compound file), as vpin reads table files
cfb = "0.15"
# our player's saved values (`VPReg.ini`), read by the settings' own rules
vpi-settings = { path = "../settings" }
# PinballX's and PinballY's game lists (XML), and their older lists in Windows' Western encoding
roxmltree = "0.21"
encoding_rs = "0.8"
# a table's physics settings files, read and written as the player reads them and VPX writes them
table-physics = { path = "../table-physics" }
# PinUP Popper's game list (`PUPDatabase.db`, SQLite), its own SQLite built in (pinned: older than
# two weeks, as every package added)
rusqlite = { version = "=0.32.1", features = ["bundled"] }
# VPS's WebP pictures turned into PNGs for PinUP Popper's folders (the player's own image library)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[[bin]]
name = "vpi-library"
path = "src/main.rs"
