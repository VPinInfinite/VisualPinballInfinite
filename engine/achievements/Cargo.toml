[package]
name = "vpi-achievements"
version.workspace = true
description = "Achievement packs: their format read and checked, their conditions followed as a game plays, and what's been earned and mastered, shared by the player and the app."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# a pack's achievements.json and the earned records (the versions the rest of the workspace uses)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
